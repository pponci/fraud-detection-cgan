name: ieee_cis
loader: ieee_cis
raw_files:
  transaction: train_transaction.csv
  identity: train_identity.csv
target: isFraud
time_col: TransactionDT
id_cols: [TransactionID]
split:
  val_size: 0.2
  test_size: 0.1
preprocessing:
  max_col_missing: 0.55
  max_row_missing: 0.48
  qualitative_cols: [
    ProductCD, card1, card2, card3, card4, card5, card6, addr1, addr2,
    P_emaildomain, R_emaildomain, M1, M2, M3, M4, M5, M6, M7, M8, M9,
    DeviceType, DeviceInfo,
    id_12, id_13, id_14, id_15, id_16, id_17, id_18, id_19, id_20, id_21, id_22, id_23,
    id_24, id_25, id_26, id_27, id_28, id_29, id_30, id_31, id_32, id_33, id_34, id_35,
    id_36, id_37, id_38,
  ]
  already_encoded_cols: [addr1, addr2, card1, card2, card3, card5]
  ohe_max_unique: 10
  skew_threshold: 0.5
  time_features: seconds_offset