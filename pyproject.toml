[project]
name = "fraud-detection"
version = "0.1.0"
description = "Autoencoder-guided conditional GAN for synthetic fraud generation under severe class imbalance"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piercarlo Ponci" }]
keywords = ["fraud-detection", "gan", "conditional-gan", "autoencoder", "imbalanced-learning", "smote", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[project.urls]
Repository = "https://github.com/pponci/fraud-detection-cgan"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "statsmodels>=0.15.0",
]

[tool.uv]
no-binary-package = ["lightgbm"]
config-settings-package = { lightgbm = { "cmake.define.USE_OPENMP" = "OFF" } }

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "ANN",
]

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__"]
strict = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
