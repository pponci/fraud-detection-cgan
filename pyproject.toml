[project]
name = "fraud-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
fraud-detection = "fraud_detection:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "ANN",
]

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__"]
strict = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
